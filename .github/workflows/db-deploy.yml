name: DB 배포

# main에 마이그레이션이 합쳐지면 운영 Supabase에 반영한다(docs/11 배포).
# 코드는 Vercel이 배포하지만 DB 구조는 바꾸지 않으므로 둘이 어긋나지 않게 여기서 맞춘다.
# 처음 한 번(마이그레이션 전부 + 주제 시드)은 Actions 탭에서 손으로 돌린다(workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
  workflow_dispatch:

permissions:
  contents: read

# 두 번 합쳐도 마이그레이션이 동시에 돌지 않게 줄을 세운다. 도중에 끊으면 반만 적용될 수 있어 취소하지 않는다
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  # 운영 설정(GitHub Secrets)을 하기 전에는 실패하지 않고 건너뛴다
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN·SUPABASE_DB_PASSWORD·SUPABASE_PROJECT_REF 중 비어 있는 값이 있어 운영 DB 반영을 건너뜁니다(docs/11)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: 운영 프로젝트 연결
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      # 무엇이 적용될지 로그에 먼저 남긴다
      - name: 적용할 마이그레이션 (dry run)
        run: supabase db push --include-seed --skip-vault --dry-run
      # seed.sql은 주제 15개 upsert뿐이라 여러 번 돌아도 같다.
      # --skip-vault: 운영 vault(푸시 크론 주소·비밀값)를 config.toml 값으로 덮어쓰지 않는다
      - name: 마이그레이션 적용
        run: supabase db push --include-seed --skip-vault --yes
