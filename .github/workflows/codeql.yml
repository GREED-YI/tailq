name: CodeQL

# 코드 정적 분석(docs/10 보안 점검 "정적 분석"). 결과는 저장소 Security 탭에 쌓인다.
# 저장소 설정의 CodeQL "default setup"을 함께 켜면 둘이 부딪히므로 이 워크플로 하나만 쓴다.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
