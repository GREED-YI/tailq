name: Supabase 깨우기

# 무료 Supabase는 7일 동안 요청이 없으면 일시정지된다. 주 3회 가벼운 조회를 1번 보내 막는다(#20, docs/11).
# 임시 장치다. 사용자가 꾸준히 들어와 매일 요청이 생기면 이 파일을 지운다.
#
# 공개 키(anon)로 주제 표를 1행만 읽는다. anon 키는 원래 브라우저 번들에 들어가는 공개 값이라
# 새로 드러나는 것이 없고, RLS 때문에 빈 목록([])이 오지만 요청은 API 게이트웨이와 DB까지 간다.
# service_role 키는 RLS를 건너뛰므로 여기에 두지 않는다.
on:
  schedule:
    # 월·수·금 09:17 KST. 정각은 GitHub 예약 실행이 몰려 늦어지므로 피한다
    - cron: "17 0 * * 1,3,5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: 주제 1행 조회
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL·SUPABASE_ANON_KEY가 없어 건너뜁니다(docs/11)."
            exit 0
          fi
          # 응답이 2xx가 아니면 실패해서 GitHub가 실패 알림 메일을 보낸다. 일시정지된 뒤라면 대시보드에서 복구한다
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/topics?select=id&limit=1"
          echo
